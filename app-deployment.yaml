apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: app
  name: app
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: app
  template:
    metadata:
      labels:
        io.kompose.service: app
    spec:
      imagePullSecrets:
        - name: devops-01
      containers:
        - env:
            - name: ASPNETCORE_FORWARDEDHEADERS_ENABLED
              value: "true"
            - name: DB_HOST_PROD
              value: SH13INTRA-DB1.marinha.pt
            - name: DB_HOST_STAGGING
              value: DEV-SH19-DB1.marinha.pt
            - name: DB_USER_PROD
              value: Processos
            - name: DB_USER_STAGGING
              value: processosUser            
            - name: DB_NAME_STAGGING
              value: Processos_DJ
            - name: DB_NAME_PROD
              value: ProcessosJustica 
            - name: DB_PASSWORD            
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: db-password
            - name: DB_PASSWORD_PROD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: db-password-prod
            - name: ConnectionStrings__DefaultConnection
              value: Server=$(DB_HOST_PROD); Database=$(DB_NAME_PROD); User Id=$(DB_USER_PROD); Password=$(DB_PASSWORD_PROD);TrustServerCertificate=True;
            - name: Keycloak__credentials__secret
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: keycloak-secret
            - name: Ldap__Marinha__Password
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: ldap-password
          image: devops-01.marinha.pt/marinha-si/processos-juridicos:1.21.2
          name: processos-juridcos-app
          ports:
            - containerPort: 8080
              protocol: TCP          
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: app
  name: app
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    io.kompose.service: app
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: app-route
  labels:
    app: processos-juridicos
spec:
  host: processos-juridicos.apps.okd-01.marinha.pt
  to:
    kind: Service
    name: app
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge