name: Release
on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for npm provenance

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.SSH_KEY }}
          ssh-known-hosts: ${{ vars.SSH_KNOWN_HOSTS }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm clean-install
      
      - name: Setup .NET 8.0.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: dotnet publish Processos-Juridicos/Processos-Juridicos.csproj

      - name: Package published files
        run: |
          cd Processos-Juridicos/bin
          tar -czf processos-juridicos.tar.gz -C ./Release .
        shell: bash

      - name: Release
        env:
          GITEA_TOKEN: ${{ secrets.PACKAGE_UPLOAD_TOKEN }}
          GITEA_URL: https://devops-01.marinha.pt
        run: |
          export NODE_OPTIONS="--use-system-ca"
          npx semantic-release
