name: Post Merge SonarQube Scan

on:
  push:
    branches:
      - master

env:
  RUNNER_TOOL_CACHE: /toolcache

jobs:
  post-merge-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.SSH_KEY }}
          ssh-known-hosts: ${{ vars.SSH_KNOWN_HOSTS }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Cache .NET SDK
        uses: actions/cache@v6
        with:
          path: /usr/share/dotnet
          key: ${{ runner.os }}-dotnet-sdk-${{ hashFiles('global.json') }}
          restore-keys: |
            ${{ runner.os }}-dotnet-sdk-

      - name: Setup .NET 10.0.x
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install SonarQube scanner + coverlet
        run: |
          mkdir -p .sonar/scanner
          dotnet tool update dotnet-sonarscanner --tool-path ./.sonar/scanner
          dotnet tool update coverlet.console --tool-path ./.sonar/coverage

      - name: Begin SonarQube Analysis
        run: |
          ./.sonar/scanner/dotnet-sonarscanner begin \
            /k:processos-juridicos \
            /d:sonar.token="${{ secrets.SONARQUBE_CI_TOKEN  }}" \
            /d:sonar.host.url="${{ vars.SONAR_HOST_URL }}" \
            /d:sonar.cs.opencover.reportsPaths=coverage.opencover.xml \
            /d:sonar.javascript.lcov.reportPaths=$(pwd)/coverage/lcov.info \
            /d:sonar.sources=. \
            /d:sonar.exclusions="**/.devcontainer/**,**/Migrations/**,**/bin/**,**/obj/**" \
            /d:sonar.scanner.scanAll=false

      - name: Build for SonarQube (no incremental)
        run: dotnet build --no-incremental

      - name: Run C# tests with coverage
        run: |
          mkdir -p coverage
          dotnet coverlet ./Processos_Juridicos.Tests/bin/Debug/net10.0/Processos_Juridicos.Tests.dll \
            --target dotnet \
            --targetargs "test --no-build" \
            -f=opencover \
            -o="coverage.opencover.xml"

      - name: Run JS tests with coverage
        run: |
          npm ci
          npx vitest run --coverage --coverage.reportsDirectory=coverage

      - name: Normalize LCOV paths
        run: |
           sed -i 's#^SF:Processos-Juridicos/wwwroot/#SF:wwwroot/#' coverage/lcov.info

      - name: End SonarQube Analysis
        run: ./.sonar/scanner/dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONARQUBE_CI_TOKEN }}"

      - name: SonarQube Quality Gate check
        id: sonarqube-quality-gate-check
        uses: sonarsource/sonarqube-quality-gate-action@master
        with:
          scanMetadataReportFile: .sonarqube/out/.sonar/report-task.txt
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBE_CI_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
