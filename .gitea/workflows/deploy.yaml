name: Deploy with kubectl

on:
  push:
    tags:
      - '*'
env:
  RUNNER_TOOL_CACHE: /toolcache

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.SSH_KEY }}
          ssh-known-hosts: ${{ vars.SSH_KNOWN_HOSTS }}

      #- name: Download Kubectl binaries
      #  run: curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"

      #- name: Install Kubectl
      #  run: sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl

      - name: Check kubectl version
        run: kubectl version --client

      - name: Extract base64 encoded config
        run: echo "${{ secrets.KUBECONFIG_DSI_PAAS_ENCODED }}" | base64 -d > /tmp/config

      - name: Apply deployment
        run: kubectl --kubeconfig=/tmp/config -n ${{ vars.DSI_PAAS_NS }} apply -f app-deployment.yaml

      - name: Update deployment image
        env:
          GITEA_REF: ${{ gitea.ref }}
          DEPLOYMENT_NAME: processos-juridicos

        run: |
          TAG="${GITEA_REF##refs/tags/v}"    
          kubectl --kubeconfig=/tmp/config -n ${{ vars.DSI_PAAS_NS }} set image deployment/processos-juridicos processos-juridicos=devops-01.marinha.pt/marinha-si/processos-juridicos:$TAG
